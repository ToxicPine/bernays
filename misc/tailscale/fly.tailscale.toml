# Fly.io configuration for Tailscale sidecar
# Deploy with: fly deploy -c infra/tailscale/fly.tailscale.toml

app = "bernays-tailscale"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.sidecar"

[env]
  # These are set via `fly secrets set`
  # TAILSCALE_AUTHKEY = "tskey-auth-..."
  # TAILSCALE_EXIT_NODE = "home-proxy" (optional - use residential exit)
  # TAILSCALE_ADVERTISE_EXIT = "true" (optional - make this an exit node)

[mounts]
  source = "tailscale_state"
  destination = "/var/lib/tailscale"

# Tailscale sidecar doesn't need external ports
# It provides networking for other Fly machines via internal network

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
