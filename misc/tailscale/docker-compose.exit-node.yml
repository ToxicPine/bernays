# Docker Compose for running a Tailscale exit node on a local machine
# This routes Fly.io traffic through your residential IP
#
# Usage:
#   1. Get auth key from https://login.tailscale.com/admin/settings/keys
#   2. export TAILSCALE_AUTHKEY="tskey-auth-..."
#   3. docker-compose -f docker-compose.exit-node.yml up -d
#   4. Approve exit node at https://login.tailscale.com/admin/machines

version: "3.8"

services:
  tailscale-exit:
    image: tailscale/tailscale:latest
    container_name: tailscale-exit-node
    hostname: home-proxy
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-exit-node --hostname=home-proxy
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      - tailscale

networks:
  tailscale:
    driver: bridge

volumes:
  tailscale-state:
    driver: local
